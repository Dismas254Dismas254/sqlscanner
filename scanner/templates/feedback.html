<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chat with Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: url('https://www.enterprisestorageforum.com/wp-content/uploads/2023/06/esf-vulnerability-scanning-and-management-696x453.png') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
    }

    .chat-container {
      max-width: 700px;
      margin: 60px auto;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      height: 80vh;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .chat-header {
      padding: 10px 15px;
      background: #075e54;
      color: white;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .message {
      padding: 10px 14px;
      border-radius: 18px;
      max-width: 70%;
      position: relative;
      display: inline-block;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-message {
      background-color: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    .admin-reply {
      background-color: #f1f0f0;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    .timestamp {
      display: block;
      font-size: 11px;
      color: gray;
      margin-top: 4px;
      text-align: right;
    }

    .sender {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin-bottom: 3px;
    }

    form {
      display: flex;
      padding: 15px;
      border-top: 1px solid #ccc;
      background: #fafafa;
      gap: 10px;
    }

    textarea {
      flex: 1;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid #ccc;
      resize: none;
      font-size: 16px;
      height: 40px;
    }

    button {
      padding: 0 20px;
      background-color: #128c7e;
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #075e54;
    }

    .back-btn {
      background-color: transparent;
      border: 1px solid #fff;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 14px;
      color: #fff;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #fff;
      color: #075e54;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <h2>Chat with Admin</h2>
      <a href="{% url 'dashboard' %}" class="back-btn">⬅ Back to Dashboard</a>
    </div>

    <div class="chat-box" id="chat-box">
      {% for fb in feedbacks %}
        <div class="message user-message">
          <div class="sender">You</div>
          {{ fb.text }}
          <span class="timestamp">{{ fb.created_at|date:"H:i" }}</span>
        </div>
        {% if fb.reply %}
          <div class="message admin-reply">
            <div class="sender">Admin</div>
            {{ fb.reply }}
            <span class="timestamp">just now</span>
          </div>
        {% endif %}
      {% empty %}
        <p>No messages yet.</p>
      {% endfor %}
    </div>

    <form id="feedback-form" method="POST">
      {% csrf_token %}
      <textarea name="feedback" placeholder="Type a message..." required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    function fetchFeedbacks() {
      $.ajax({
        url: '',
        method: 'GET',
        dataType: 'json',
        headers: { 'X-Requested-With': 'XMLHttpRequest' },
        success: function(response) {
          const chatBox = $('#chat-box');
          chatBox.html('');
          response.feedbacks.forEach(fb => {
            chatBox.append(`
              <div class="message user-message">
                <div class="sender">You</div>
                ${fb.text}
                <span class="timestamp">${fb.time}</span>
              </div>
            `);
            if (fb.reply) {
              chatBox.append(`
                <div class="message admin-reply">
                  <div class="sender">Admin</div>
                  ${fb.reply}
                  <span class="timestamp">${fb.time}</span>
                </div>
              `);
            }
          });
          chatBox.scrollTop(chatBox[0].scrollHeight);
        }
      });
    }

    // Initial load
    fetchFeedbacks();

    // Poll every 5 seconds
    setInterval(fetchFeedbacks, 5000);

    // AJAX form submit
    $('#feedback-form').on('submit', function(e) {
      e.preventDefault();
      const form = $(this);
      $.post('', form.serialize(), function() {
        form[0].reset();
        fetchFeedbacks();
      });
    });
  </script>

</body>
</html>
