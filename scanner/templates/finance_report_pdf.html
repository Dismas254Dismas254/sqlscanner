<!-- finance_report_pdf.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Finance Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        h1, h2 { text-align: center; }
        .summary { margin-top: 30px; }
        .summary p { font-size: 16px; margin-bottom: 8px; }
        .chart { margin-top: 30px; text-align: center; }
        .generated-time { margin-top: 40px; text-align: center; font-size: 14px; color: gray; }
    </style>
</head>
<body>

    <h1>Finance Report</h1>

    <div class="summary">
        <h2>Summary</h2>
        <p><strong>Premium Users:</strong> {{ premium_users_count }}</p>
        <p><strong>Cash Pending Users:</strong> {{ cash_pending_count }}</p>
        <p><strong>M-Pesa Pending Users:</strong> {{ mpesa_pending_count }}</p>
    </div>

    <div class="chart">
        <h2>Distribution Chart</h2>
        <img src="data:image/png;base64,{{ pie_chart }}" width="400" height="400" />
    </div>

    <div class="generated-time">
        Report generated on: {{ generated_time }}
    </div>

</body>
</html>
